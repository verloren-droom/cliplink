[package]
name = "cliplink"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
agnostic-mdns = { version = "0.4.2", features = ["tokio"] }
crossbeam-channel = "0.5.15"
directories = "5.0.1"
fs2 = "0.4.3"
parking_lot = "0.12.5"
quinn = { version = "0.11.9", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
rcgen = "0.13.2"
ring = "0.17.14"
rusqlite = { version = "0.37.0", features = ["bundled"] }
rustls = { version = "0.23.37", default-features = false, features = ["std", "ring"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.10.9"
thiserror = "2.0.18"
time = { version = "0.3.45", features = ["formatting", "macros", "serde"] }
tokio = { version = "1.50.0", features = ["fs", "io-util", "macros", "net", "rt", "sync", "time"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
uuid = { version = "1.22.0", features = ["serde", "v4"] }

[target.'cfg(target_os = "android")'.dependencies]
jni = { version = "0.21.1", default-features = false }

[target.'cfg(target_os = "windows")'.dependencies]
global-hotkey = "0.7.0"
windows-sys = { version = "0.59.0", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security_Cryptography",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_SystemServices",
    "Win32_UI_Controls",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(not(any(target_os = "android", target_os = "macos", target_os = "windows")))'.dependencies]
arboard = "3.6.1"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = { version = "0.6.2", default-features = false, features = ["alloc"] }
global-hotkey = "0.7.0"
objc2 = { version = "0.6.4", features = ["unstable-requires-macos"] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSApplication", "NSButton", "NSCell", "NSColor", "NSControl", "NSEvent", "NSFont", "NSGraphics", "NSImage", "NSImageView", "NSMenu", "NSMenuItem", "NSPanel", "NSParagraphStyle", "NSPasteboard", "NSPasteboardItem", "NSResponder", "NSRunningApplication", "NSScreen", "NSSearchField", "NSScrollView", "NSStatusBar", "NSStatusBarButton", "NSStatusItem", "NSTabView", "NSTabViewItem", "NSTableCellView", "NSTableColumn", "NSTableHeaderView", "NSTableView", "NSText", "NSTextField", "NSTextView", "NSUserInterfaceItemIdentification", "NSView", "NSWindow", "NSWorkspace", "block2", "objc2-core-foundation"] }
objc2-core-graphics = { version = "0.3.2", default-features = false, features = ["std", "objc2", "bitflags", "CGEvent", "CGEventSource", "CGEventTypes", "CGRemoteOperation"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["NSArray", "NSIndexSet", "NSNotification", "NSObject", "NSGeometry", "NSString", "NSTimer", "NSURL"] }

[profile.dev]
debug = 0
opt-level = 2
strip = "debuginfo"

[profile.release]
codegen-units = 1
debug = 0
lto = "thin"
panic = "abort"
strip = "symbols"
