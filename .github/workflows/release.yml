  build-android:
    name: Build Android Assets
    runs-on: ubuntu-latest
    needs: detect-version
    if: needs.detect-version.outputs.should_release == 'true'
    environment: release
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-ndk
        run: |
          if ! cargo ndk --version >/dev/null 2>&1; then
            cargo install cargo-ndk --locked
          fi

      - name: Accept Android SDK Licenses
        run: yes | sdkmanager --licenses >/dev/null

      - name: Install Android SDK Packages
        run: |
          chmod +x scripts/build.sh
          ./scripts/build.sh android-setup

      - name: Prepare Android Signing Keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          : "${ANDROID_KEYSTORE_BASE64:?Missing release secret ANDROID_KEYSTORE_BASE64}"
          : "${ANDROID_KEYSTORE_PASSWORD:?Missing release secret ANDROID_KEYSTORE_PASSWORD}"
          : "${ANDROID_KEY_ALIAS:?Missing release secret ANDROID_KEY_ALIAS}"
          : "${ANDROID_KEY_PASSWORD:?Missing release secret ANDROID_KEY_PASSWORD}"

          mkdir -p packaging/android

          keystore_path="$GITHUB_WORKSPACE/packaging/android/release.keystore"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore_path"
          chmod 600 "$keystore_path"

          {
            echo "ANDROID_KEYSTORE_PATH=$keystore_path"
            echo "ANDROID_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD"
            echo "ANDROID_KEY_ALIAS=$ANDROID_KEY_ALIAS"
            echo "ANDROID_KEY_PASSWORD=$ANDROID_KEY_PASSWORD"
          } >> "$GITHUB_ENV"

          echo "Prepared Android signing keystore in packaging/android."
          echo "Configured Gradle release signing environment variables."

      - name: Build Android Release
        run: |
          ./scripts/build.sh android-release
          echo "Android build outputs:"
          find android/app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | sort

      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-android
          if-no-files-found: error
          path: |
            android/app/build/outputs/apk/release/*.apk

  publish-release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs:
      - detect-version
      - build-macos
      # - build-windows
      - build-android
    if: needs.detect-version.outputs.should_release == 'true'
    permissions:
      contents: write
    steps:
      - name: Ensure Release Tag Exists
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.detect-version.outputs.tag }}
          RELEASE_TARGET: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          echo "Ensuring release tag ${RELEASE_TAG} points at ${RELEASE_TARGET}"

          if gh api "repos/${REPOSITORY}/git/ref/tags/${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "Tag ${RELEASE_TAG} already exists."
            exit 0
          fi

          gh api \
            --method POST \
            "repos/${REPOSITORY}/git/refs" \
            -f ref="refs/tags/${RELEASE_TAG}" \
            -f sha="${RELEASE_TARGET}"

      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: release-assets

      - name: List Release Assets
        run: find release-assets -maxdepth 1 -type f | sort

      - name: Create or Update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.detect-version.outputs.tag }}
          RELEASE_TARGET: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          shopt -s nullglob

          assets=(release-assets/*)
          if [[ "${#assets[@]}" -eq 0 ]]; then
            echo "No release assets were produced." >&2
            exit 1
          fi

          echo "Publishing GitHub Release for ${RELEASE_TAG}"
          echo "Assets to upload:"
          printf '  %s\n' "${assets[@]}"

          if ! gh release view "$RELEASE_TAG" --repo "$REPOSITORY" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" \
              --repo "$REPOSITORY" \
              --title "$RELEASE_TAG" \
              --target "$RELEASE_TARGET" \
              --generate-notes
          fi

          gh release upload "$RELEASE_TAG" "${assets[@]}" --repo "$REPOSITORY" --clobber

          echo "Uploaded release assets:"
          gh release view "$RELEASE_TAG" \
            --repo "$REPOSITORY" \
            --json url,assets \
            --jq '.url, (.assets[]?.name // "no-assets")'
