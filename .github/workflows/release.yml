name: Release

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  detect-version:
    name: Detect Version Change
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.detect.outputs.version }}
      tag: ${{ steps.detect.outputs.tag }}
      should_release: ${{ steps.detect.outputs.should_release }}
      release_reason: ${{ steps.detect.outputs.release_reason }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Fetch Tags
        run: git fetch --force --tags

      - name: Detect Release Version
        id: detect
        run: |
          set -euo pipefail

          extract_version_from_file() {
            local file_path="$1"
            awk -F ' *= *' '
              $0 == "[package]" { in_package = 1; next }
              /^\[/ && in_package { exit }
              in_package && $1 == "version" {
                value = $2
                gsub(/^"/, "", value)
                gsub(/"$/, "", value)
                print value
                exit
              }
            ' "$file_path"
          }

          extract_version_from_ref() {
            local git_ref="$1"
            git show "${git_ref}:Cargo.toml" | awk -F ' *= *' '
              $0 == "[package]" { in_package = 1; next }
              /^\[/ && in_package { exit }
              in_package && $1 == "version" {
                value = $2
                gsub(/^"/, "", value)
                gsub(/"$/, "", value)
                print value
                exit
              }
            '
          }

          current_version="$(extract_version_from_file Cargo.toml)"
          if [[ -z "$current_version" ]]; then
            echo "Failed to read package version from Cargo.toml." >&2
            exit 1
          fi

          release_tag="v${current_version}"
          previous_version=""
          previous_sha="${{ github.event.before }}"

          if [[ -n "$previous_sha" && "$previous_sha" != "0000000000000000000000000000000000000000" ]] \
            && git cat-file -e "${previous_sha}:Cargo.toml" 2>/dev/null; then
            previous_version="$(extract_version_from_ref "$previous_sha")"
          fi

          tag_exists="false"
          if git rev-parse -q --verify "refs/tags/${release_tag}" >/dev/null; then
            tag_exists="true"
          fi

          should_release="false"
          release_reason="Version did not change."

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            should_release="true"
            release_reason="Manual release dispatch requested."
          elif [[ "$tag_exists" != "true" ]]; then
            should_release="true"
            if [[ "$current_version" != "$previous_version" ]]; then
              if [[ -n "$previous_version" ]]; then
                release_reason="Version changed from ${previous_version} to ${current_version}."
              else
                release_reason="Version changed to ${current_version}."
              fi
            else
              release_reason="Tag ${release_tag} does not exist yet."
            fi
          elif [[ "$current_version" != "$previous_version" ]]; then
            release_reason="Version changed, but tag ${release_tag} already exists."
          fi

          echo "Current version: ${current_version}"
          echo "Release tag: ${release_tag}"
          if [[ -n "$previous_version" ]]; then
            echo "Previous version: ${previous_version}"
          else
            echo "Previous version: <none>"
          fi
          echo "Tag already exists: ${tag_exists}"

          {
            echo "version=${current_version}"
            echo "tag=${release_tag}"
            echo "should_release=${should_release}"
            echo "release_reason=${release_reason}"
          } >> "$GITHUB_OUTPUT"

      - name: Print Decision
        run: |
          echo "Release decision summary:"
          echo "  version=${{ steps.detect.outputs.version }}"
          echo "  tag=${{ steps.detect.outputs.tag }}"
          echo "  should_release=${{ steps.detect.outputs.should_release }}"
          echo "  reason=${{ steps.detect.outputs.release_reason }}"

